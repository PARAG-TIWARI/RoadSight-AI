name: RoadSight CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/roadsight-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/roadsight-ci.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest -q

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose-smoke:
    name: Docker Compose backend smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build and start backend with Compose
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker compose -f docker-compose.yml down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose -f docker-compose.yml up -d --build backend

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8000/api/v1/health >/dev/null; then
              ready=1
              break
            fi

            if [ "$(docker compose -f docker-compose.yml ps --status running -q backend | wc -l)" -eq 0 ]; then
              docker compose -f docker-compose.yml logs backend
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "RoadSight backend did not become healthy on port 8000."
            docker compose -f docker-compose.yml logs backend
            exit 1
          fi

          curl --fail --show-error http://localhost:8000/api/v1/health
